plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retrogame.snes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.retrogame.snes'
        minSdk 26          // AAudio (som nativo) existe a partir do Android 8.0
        targetSdk 34       // 34: o Android 15 não força a tela "de borda a borda" na página
        versionCode 2
        versionName '2.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // a página não deve ser comprimida no APK (carrega mais rápido)
    androidResources {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
