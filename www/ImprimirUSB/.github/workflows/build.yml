name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar o driver livre foo2zjs
        run: |
          mkdir -p ext && cd ext
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev
          apt-get source -q foo2zjs jbigkit \
            || git clone --depth 1 https://github.com/koenkooi/foo2zjs.git foo2zjs-git
          ls -la

      - name: Compilar o driver para Android
        run: bash native/build.sh

      - name: Compilar o app
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Imprimir-USB-APK
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-ajuda
          path: foo2xqx-ajuda.txt
          if-no-files-found: ignore
