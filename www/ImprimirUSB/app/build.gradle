plugins { id 'com.android.application' }

android {
    namespace 'br.imprimir.usb'
    compileSdk 34
    defaultConfig {
        applicationId 'br.imprimir.usb'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // o driver nativo é um executável chamado libfoo2xqx.so; precisa ser extraído no aparelho
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError false }
}
